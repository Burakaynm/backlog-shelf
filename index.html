<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Takip & Kütüphane (Sürükle & Bırak)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-purple: #a855f7;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.8rem; }
        p.subtitle { margin: 6px 0 0 0; color: var(--text-muted); font-size: 0.9rem; }

        /* FORM */
        .add-form {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #334155;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, select, button {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: var(--input-bg);
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        input { flex: 1; min-width: 180px; }
        select { min-width: 160px; cursor: pointer; }
        button.add-btn {
            background-color: var(--accent-blue);
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        button.add-btn:hover { opacity: 0.9; }

        section { margin-bottom: 24px; }

        h2 {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
        }

        h2 .count {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(148, 163, 184, 0.12);
            border-radius: 999px;
            padding: 2px 8px;
        }

        /* Basligi bitiren ince cizgi */
        h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, #334155, transparent);
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 50px;
            padding: 8px;
            border-radius: 10px;
            border: 2px dashed transparent;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .game-list.drag-over {
            border-color: var(--accent-blue);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .game-card {
            background-color: var(--card-bg);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #475569;
            cursor: grab;
            user-select: none;
            transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
        }

        .game-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
        }

        .game-card:active {
            cursor: grabbing;
        }

        .empty-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 14px;
            text-align: center;
            border: 1px dashed #334155;
            border-radius: 8px;
        }

        .game-card.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .game-card.playing { border-left-color: var(--accent-purple); }
        .game-card.completed { border-left-color: var(--accent-green); }
        .game-card.dropped { border-left-color: var(--accent-red); }
        .game-card.planned { border-left-color: var(--accent-amber); }

        .game-title { font-weight: 600; font-size: 0.95rem; }
        .game-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }

        .right-side {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .badge-playing { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .badge-fav { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge-done { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-drop { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-plan { background: rgba(245, 158, 11, 0.2); color: #fba124; }

        /* Favori: kartin etrafinda cerceve yok, yalniz yildiz */
        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #475569;
            font-size: 1.15rem;
            line-height: 1;
            padding: 2px 4px;
            transition: color 0.15s, transform 0.15s, text-shadow 0.2s;
        }
        .fav-btn:hover { color: var(--accent-amber); transform: scale(1.2); }
        .fav-btn.active {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.55);
        }
        .fav-btn.just-favved { animation: fav-pop 0.3s ease; }

        @keyframes fav-pop {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
        }
        .delete-btn:hover { color: var(--accent-red); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎮 Oyun Takip & Kütüphane</h1>
    </header>

    <!-- OYUN EKLEME FORMU -->
    <div class="add-form">
        <strong style="font-size: 0.9rem; color: var(--text-muted);">➕ Hızlı Oyun Ekle</strong>
        <div class="form-row">
            <input type="text" id="gameTitle" placeholder="Oyun Adı">
            <input type="text" id="gameDesc" placeholder="Not / Açıklama (İsteğe bağlı)">
        </div>
        <div class="form-row">
            <select id="gameCategory">
                <option value="playing">🟣 Şu An Oynananlar</option>
                <option value="completed">🟢 Bitirilenler</option>
                <option value="dropped">🔴 Yarım Kalanlar</option>
                <option value="planned">🟡 Bekleyenler / Satın Alınanlar</option>
            </select>
            <select id="gameBadge">
                <option value="OYNANIYOR">Oynanıyor</option>
                <option value="BİTİRİLDİ">Bitirildi</option>
                <option value="FAVORİ ★">Favori ★ (yalnız bitirilenler)</option>
                <option value="YARIM KALDI">Yarım Kaldı</option>
                <option value="BIRAKILDI">Bırakıldı</option>
                <option value="BEKLENİYOR">İndirim / Zaman Bekliyor</option>
            </select>
            <button class="add-btn" onclick="addGame()">Listeye Ekle</button>
        </div>
    </div>

    <!-- ŞU AN OYNANANLAR -->
    <section>
        <h2 style="color: var(--accent-purple);">🟣 Şu An Oynananlar <span class="count" id="count-playing">0</span></h2>
        <div class="game-list" id="list-playing" data-cat="playing"></div>
    </section>

    <!-- BİTİRİLEN OYUNLAR -->
    <section>
        <h2 style="color: var(--accent-green);">🟢 Bitirilen Oyunlar <span class="count" id="count-completed">0</span></h2>
        <div class="game-list" id="list-completed" data-cat="completed"></div>
    </section>

    <!-- YARIM KALANLAR -->
    <section>
        <h2 style="color: var(--accent-red);">🔴 Yarım Kalanlar / Sarmayanlar <span class="count" id="count-dropped">0</span></h2>
        <div class="game-list" id="list-dropped" data-cat="dropped"></div>
    </section>

    <!-- BEKLEYENLER -->
    <section>
        <h2 style="color: var(--accent-amber);">🟡 Satın Alınan / Beklemedekiler <span class="count" id="count-planned">0</span></h2>
        <div class="game-list" id="list-planned" data-cat="planned"></div>
    </section>
</div>

<script>
    const defaultGames = [
        { id: 20, title: "Final Fantasy XVI", desc: "Hikaye & aksiyon harika, aktif olarak oynanıyor", cat: "playing", badge: "OYNANIYOR", bClass: "badge-playing" },

        { id: 1, title: "Red Dead Redemption 2", desc: "Arthur Morgan ile mükemmel bağ & hikaye", cat: "completed", badge: "FAVORİ ★", bClass: "badge-fav" },
        { id: 2, title: "Kingdom Come: Deliverance 2", desc: "Henry'nin intikam hikayesi ve karakter bağı", cat: "completed", badge: "FAVORİ ★", bClass: "badge-fav" },
        { id: 3, title: "Kingdom Come: Deliverance 1", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        { id: 4, title: "Elden Ring", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        { id: 5, title: "Cyberpunk 2077", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        { id: 6, title: "Ghost of Tsushima", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        { id: 7, title: "Detroit: Become Human", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        { id: 8, title: "The Last of Us Part 1", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        { id: 9, title: "Mafia 1 Definitive Edition", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        { id: 10, title: "Mount & Blade II: Bannerlord", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        { id: 11, title: "Clair Obscur: Expedition 33", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        { id: 12, title: "Death Stranding 1 & 2", desc: "", cat: "completed", badge: "BİTİRİLDİ", bClass: "badge-done" },
        
        { id: 13, title: "God of War (2018)", desc: "6-7 saat oynandı, vuruş hissi/hikaye sevildi ama salındı", cat: "dropped", badge: "YARIM KALDI", bClass: "badge-drop" },
        { id: 14, title: "Days Gone", desc: "20 saat oynandı, animasyonlar kütük geldi", cat: "dropped", badge: "BIRAKILDI", bClass: "badge-drop" },
        { id: 15, title: "Spider-Man Remastered & AC Valhalla", desc: "GoT ve Elden Ring sonrası dövüşleri sığ geldi", cat: "dropped", badge: "BIRAKILDI", bClass: "badge-drop" },
        { id: 16, title: "Uncharted 4: A Thief's End", desc: "Klavye kontrolleri garip geldi, aşırı film tarzı sarmadı", cat: "dropped", badge: "BIRAKILDI", bClass: "badge-drop" },
        { id: 17, title: "Witcher 3: Wild Hunt", desc: "Grafik ve mekanikler eski geldi", cat: "dropped", badge: "BIRAKILDI", bClass: "badge-drop" },
        { id: 18, title: "Star Wars Jedi: Fallen Order", desc: "Eskiden kolla oynarken ilk boss'ta sinirlenip bırakıldı", cat: "dropped", badge: "BIRAKILDI", bClass: "badge-drop" },
        { id: 19, title: "Max Payne 3 & Metro Exodus", desc: "Max Payne fazla sığ, Metro aşırı yavaş geldi", cat: "dropped", badge: "BIRAKILDI", bClass: "badge-drop" },

        { id: 21, title: "Cyberpunk 2077: Phantom Liberty (DLC)", desc: "Kütüphanede var, uygun vakitte oynanacak", cat: "planned", badge: "BEKLENİYOR", bClass: "badge-plan" },
        { id: 22, title: "Metal Gear Solid Δ: Snake Eater", desc: "Aşırı gizlilik (stealth) içerdiği için riskli", cat: "planned", badge: "BEKLENİYOR", bClass: "badge-plan" }
    ];

    const STORE_KEY = 'myGameListDragDrop_v2';

    let draggedGameId = null;
    let justFavvedId = null; // yildiz animasyonu yalniz yeni isaretlenene uygulanir

    // Kategorinin varsayilan etiketi (favori artik etikette degil, yildizda tutuluyor)
    function defaultBadgeFor(cat) {
        switch (cat) {
            case 'playing':   return { badge: 'OYNANIYOR',  bClass: 'badge-playing' };
            case 'completed': return { badge: 'BİTİRİLDİ',  bClass: 'badge-done' };
            case 'dropped':   return { badge: 'BIRAKILDI',  bClass: 'badge-drop' };
            default:          return { badge: 'BEKLENİYOR', bClass: 'badge-plan' };
        }
    }

    function getGames() {
        const stored = localStorage.getItem(STORE_KEY);
        const games = stored ? JSON.parse(stored) : defaultGames;

        // Eski kayitlar: "FAVORİ ★" etiketi olanlari fav alanina tasi.
        // Favori yalniz BITIRILEN oyunlarda olabilir.
        let migrated = false;
        games.forEach(g => {
            if (g.fav === undefined) {
                g.fav = g.cat === 'completed' && /FAVOR/i.test(g.badge || '');
                if (/FAVOR/i.test(g.badge || '')) Object.assign(g, defaultBadgeFor(g.cat));
                migrated = true;
            } else if (g.fav && g.cat !== 'completed') {
                g.fav = false;
                migrated = true;
            }
        });

        if (!stored || migrated) localStorage.setItem(STORE_KEY, JSON.stringify(games));
        return games;
    }

    function saveGames(games) {
        localStorage.setItem(STORE_KEY, JSON.stringify(games));
        render();
    }

    function toggleFav(id) {
        const games = getGames();
        const game = games.find(g => g.id === id);
        if (!game || game.cat !== 'completed') return; // favori yalniz bitirilenlerde

        game.fav = !game.fav;
        justFavvedId = game.fav ? id : null;
        saveGames(games);
    }

    function addGame() {
        const title = document.getElementById('gameTitle').value.trim();
        const desc = document.getElementById('gameDesc').value.trim();
        const cat = document.getElementById('gameCategory').value;
        const selected = document.getElementById('gameBadge').value;

        if (!title) {
            alert('Lütfen bir oyun adı girin!');
            return;
        }

        // "Favori ★" secildiyse: etiket kategoriye gore konur; yildiz yalniz bitirilenlerde
        const wantsFav = /FAVOR/i.test(selected);
        const fav = wantsFav && cat === 'completed';
        let badge = selected;
        let bClass = 'badge-done';

        if (wantsFav) {
            ({ badge, bClass } = defaultBadgeFor(cat));
        } else if (selected.includes('OYNANIYOR')) bClass = 'badge-playing';
        else if (selected.includes('BIRAKILDI') || selected.includes('YARIM')) bClass = 'badge-drop';
        else if (selected.includes('BEKLENİYOR')) bClass = 'badge-plan';

        const games = getGames();
        games.push({
            id: Date.now(),
            title,
            desc,
            cat,
            badge,
            bClass,
            fav
        });

        saveGames(games);

        document.getElementById('gameTitle').value = '';
        document.getElementById('gameDesc').value = '';
    }

    function deleteGame(id) {
        let games = getGames();
        games = games.filter(g => g.id !== id);
        saveGames(games);
    }

    function render() {
        const games = getGames();
        
        ['playing', 'completed', 'dropped', 'planned'].forEach(cat => {
            const container = document.getElementById(`list-${cat}`);
            container.innerHTML = '';
            
            // Favoriler listenin en USTUNDE (sort kararli, geri kalan sira korunur)
            const filtered = games
                .filter(g => g.cat === cat)
                .sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0));

            const counter = document.getElementById(`count-${cat}`);
            if (counter) counter.textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-hint">Buraya bir oyun sürükleyin.</div>';
            } else {
                filtered.forEach(g => {
                    const card = document.createElement('div');
                    card.className = `game-card ${g.cat}`;
                    card.setAttribute('draggable', 'true');
                    card.setAttribute('data-id', g.id);

                    card.innerHTML = `
                        <div>
                            <div class="game-title">${g.title}</div>
                            ${g.desc ? `<div class="game-desc">${g.desc}</div>` : ''}
                        </div>
                        <div class="right-side">
                            <span class="badge ${g.bClass}">${g.badge}</span>
                            ${g.cat === 'completed' ? `<button class="fav-btn ${g.fav ? 'active' : ''} ${g.fav && g.id === justFavvedId ? 'just-favved' : ''}" onclick="toggleFav(${g.id})" title="${g.fav ? 'Favoriden çıkar' : 'Favoriye ekle'}">${g.fav ? '★' : '☆'}</button>` : ''}
                            <button class="delete-btn" onclick="deleteGame(${g.id})" title="Sil">✕</button>
                        </div>
                    `;

                    // Drag Events
                    card.addEventListener('dragstart', (e) => {
                        draggedGameId = g.id;
                        card.classList.add('dragging');
                        e.dataTransfer.setData('text/plain', g.id);
                    });

                    card.addEventListener('dragend', () => {
                        card.classList.remove('dragging');
                        draggedGameId = null;
                    });

                    container.appendChild(card);
                });
            }

            // Drop zone event listeners
            container.ondragover = (e) => {
                e.preventDefault();
                container.classList.add('drag-over');
            };

            container.ondragleave = () => {
                container.classList.remove('drag-over');
            };

            container.ondrop = (e) => {
                e.preventDefault();
                container.classList.remove('drag-over');
                
                if (draggedGameId) {
                    const gamesList = getGames();
                    const targetGame = gamesList.find(g => g.id === draggedGameId);
                    
                    if (targetGame && targetGame.cat !== cat) {
                        targetGame.cat = cat;
                        
                        // Kategoriye göre etiketi otomatik güncelle
                        Object.assign(targetGame, defaultBadgeFor(cat));

                        // Favori yalniz bitirilenlerde olabilir → baska listeye tasinirsa yildiz duser
                        if (cat !== 'completed') targetGame.fav = false;

                        // Sürüklenen oyunu dizinin sonuna taşı → hedef listenin en ALTINDA görünsün
                        const idx = gamesList.indexOf(targetGame);
                        if (idx > -1) {
                            gamesList.splice(idx, 1);
                            gamesList.push(targetGame);
                        }

                        saveGames(gamesList);
                    }
                }
            };
        });

        justFavvedId = null; // animasyon bir kez oynar
    }

    render();
</script>

</body>
</html>
