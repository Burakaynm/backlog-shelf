<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backlog Shelf — Game Tracker (Drag & Drop)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-purple: #a855f7;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.8rem; }
        p.subtitle { margin: 6px 0 0 0; color: var(--text-muted); font-size: 0.9rem; }

        .profile-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .profile-bar label {
            font-size: 0.72rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .profile-bar select {
            min-width: 150px;
            padding: 7px 10px;
            font-size: 0.85rem;
        }

        .ghost-btn {
            background: transparent;
            border: 1px solid #475569;
            color: var(--text-muted);
            padding: 7px 12px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .ghost-btn:hover { color: var(--text-main); border-color: var(--accent-blue); }

        /* FORM */
        .add-form {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #334155;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, select, button {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: var(--input-bg);
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        input { flex: 1; min-width: 180px; }
        select { min-width: 160px; cursor: pointer; }
        button.add-btn {
            background-color: var(--accent-blue);
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        button.add-btn:hover { opacity: 0.9; }

        section { margin-bottom: 24px; }

        h2 {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
        }

        h2 .count {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(148, 163, 184, 0.12);
            border-radius: 999px;
            padding: 2px 8px;
        }

        /* Thin rule that finishes the heading */
        h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, #334155, transparent);
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 50px;
            padding: 8px;
            border-radius: 10px;
            border: 2px dashed transparent;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .game-list.drag-over {
            border-color: var(--accent-blue);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .game-card {
            background-color: var(--card-bg);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #475569;
            cursor: grab;
            user-select: none;
            transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
        }

        .game-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
        }

        .game-card:active {
            cursor: grabbing;
        }

        .empty-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 14px;
            text-align: center;
            border: 1px dashed #334155;
            border-radius: 8px;
        }

        .game-card.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .game-card.playing { border-left-color: var(--accent-purple); }
        .game-card.completed { border-left-color: var(--accent-green); }
        .game-card.dropped { border-left-color: var(--accent-red); }
        .game-card.planned { border-left-color: var(--accent-amber); }

        .game-title { font-weight: 600; font-size: 0.95rem; }
        .game-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }

        .right-side {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .badge-playing { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .badge-done { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-drop { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-plan { background: rgba(245, 158, 11, 0.2); color: #fba124; }

        /* Favorite: no ring around the card, just the star */
        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #475569;
            font-size: 1.15rem;
            line-height: 1;
            padding: 2px 4px;
            transition: color 0.15s, transform 0.15s, text-shadow 0.2s;
        }
        .fav-btn:hover { color: var(--accent-amber); transform: scale(1.2); }
        .fav-btn.active {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.55);
        }
        .fav-btn.just-favved { animation: fav-pop 0.3s ease; }

        @keyframes fav-pop {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
        }
        .delete-btn:hover { color: var(--accent-red); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎮 Backlog Shelf</h1>
        <p class="subtitle">Drag a game between the shelves. Every profile is stored in this browser only.</p>

        <div class="profile-bar">
            <label for="profileSelect">Profile</label>
            <select id="profileSelect" onchange="switchProfile(this.value)"></select>
            <button class="ghost-btn" onclick="createProfile()">+ New</button>
            <button class="ghost-btn" onclick="renameProfile()">Rename</button>
            <button class="ghost-btn" onclick="deleteProfile()">Delete</button>
        </div>
    </header>

    <!-- ADD GAME FORM -->
    <div class="add-form">
        <strong style="font-size: 0.9rem; color: var(--text-muted);">➕ Quick add</strong>
        <div class="form-row">
            <input type="text" id="gameTitle" placeholder="Game title">
            <input type="text" id="gameDesc" placeholder="Note / description (optional)">
        </div>
        <div class="form-row">
            <select id="gameCategory">
                <option value="playing">🟣 Now Playing</option>
                <option value="completed">🟢 Completed</option>
                <option value="dropped">🔴 Dropped</option>
                <option value="planned">🟡 Backlog / Purchased</option>
            </select>
            <select id="gameBadge">
                <option value="PLAYING">Playing</option>
                <option value="COMPLETED">Completed</option>
                <option value="FAVORITE ★">Favorite ★ (completed only)</option>
                <option value="UNFINISHED">Unfinished</option>
                <option value="DROPPED">Dropped</option>
                <option value="BACKLOG">Waiting for a sale / free time</option>
            </select>
            <button class="add-btn" onclick="addGame()">Add to shelf</button>
        </div>
    </div>

    <!-- NOW PLAYING -->
    <section>
        <h2 style="color: var(--accent-purple);">🟣 Now Playing <span class="count" id="count-playing">0</span></h2>
        <div class="game-list" id="list-playing" data-cat="playing"></div>
    </section>

    <!-- COMPLETED -->
    <section>
        <h2 style="color: var(--accent-green);">🟢 Completed <span class="count" id="count-completed">0</span></h2>
        <div class="game-list" id="list-completed" data-cat="completed"></div>
    </section>

    <!-- DROPPED -->
    <section>
        <h2 style="color: var(--accent-red);">🔴 Dropped / Didn't Click <span class="count" id="count-dropped">0</span></h2>
        <div class="game-list" id="list-dropped" data-cat="dropped"></div>
    </section>

    <!-- BACKLOG -->
    <section>
        <h2 style="color: var(--accent-amber);">🟡 Purchased / Backlog <span class="count" id="count-planned">0</span></h2>
        <div class="game-list" id="list-planned" data-cat="planned"></div>
    </section>
</div>

<script>
    const defaultGames = [
        { id: 20, title: "Final Fantasy XVI", desc: "Great story and combat, currently in progress", cat: "playing", badge: "PLAYING", bClass: "badge-playing", fav: false },

        { id: 1, title: "Red Dead Redemption 2", desc: "Superb story and a real bond with Arthur Morgan", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: true },
        { id: 2, title: "Kingdom Come: Deliverance 2", desc: "Henry's revenge arc and character growth", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: true },
        { id: 3, title: "Kingdom Come: Deliverance 1", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },
        { id: 4, title: "Elden Ring", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },
        { id: 5, title: "Cyberpunk 2077", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },
        { id: 6, title: "Ghost of Tsushima", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },
        { id: 7, title: "Detroit: Become Human", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },
        { id: 8, title: "The Last of Us Part 1", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },
        { id: 9, title: "Mafia 1 Definitive Edition", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },
        { id: 10, title: "Mount & Blade II: Bannerlord", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },
        { id: 11, title: "Clair Obscur: Expedition 33", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },
        { id: 12, title: "Death Stranding 1 & 2", desc: "", cat: "completed", badge: "COMPLETED", bClass: "badge-done", fav: false },

        { id: 13, title: "God of War (2018)", desc: "6-7 hours in; loved the combat feel and story but drifted away", cat: "dropped", badge: "UNFINISHED", bClass: "badge-drop", fav: false },
        { id: 14, title: "Days Gone", desc: "20 hours in; animations felt clunky", cat: "dropped", badge: "DROPPED", bClass: "badge-drop", fav: false },
        { id: 15, title: "Spider-Man Remastered & AC Valhalla", desc: "Combat felt shallow after Ghost of Tsushima and Elden Ring", cat: "dropped", badge: "DROPPED", bClass: "badge-drop", fav: false },
        { id: 16, title: "Uncharted 4: A Thief's End", desc: "Keyboard controls felt odd, too movie-like for my taste", cat: "dropped", badge: "DROPPED", bClass: "badge-drop", fav: false },
        { id: 17, title: "Witcher 3: Wild Hunt", desc: "Visuals and mechanics felt dated", cat: "dropped", badge: "DROPPED", bClass: "badge-drop", fav: false },
        { id: 18, title: "Star Wars Jedi: Fallen Order", desc: "Rage-quit at the first boss back in the gamepad days", cat: "dropped", badge: "DROPPED", bClass: "badge-drop", fav: false },
        { id: 19, title: "Max Payne 3 & Metro Exodus", desc: "Max Payne too shallow, Metro way too slow", cat: "dropped", badge: "DROPPED", bClass: "badge-drop", fav: false },

        { id: 21, title: "Cyberpunk 2077: Phantom Liberty (DLC)", desc: "Owned, waiting for the right time", cat: "planned", badge: "BACKLOG", bClass: "badge-plan", fav: false },
        { id: 22, title: "Metal Gear Solid Δ: Snake Eater", desc: "Heavy stealth, so it is a risky pick", cat: "planned", badge: "BACKLOG", bClass: "badge-plan", fav: false }
    ];

    const PROFILES_KEY = 'backlogShelf_profiles';
    const SHELF_PREFIX = 'backlogShelf_v1:';
    const LEGACY_KEY = 'backlogShelf_v1'; // single-shelf layout, before profiles existed

    let profiles = [];
    let activeProfile = '';

    function shelfKey(name) {
        return SHELF_PREFIX + name;
    }

    function loadProfiles() {
        let meta = null;
        try {
            meta = JSON.parse(localStorage.getItem(PROFILES_KEY));
        } catch (err) {
            console.warn('Profile list was unreadable, starting a fresh one.', err);
        }

        if (meta && Array.isArray(meta.profiles) && meta.profiles.length) {
            profiles = meta.profiles;
            activeProfile = profiles.includes(meta.active) ? meta.active : profiles[0];
            return;
        }

        // First run — or an upgrade from the version that had a single shelf
        profiles = ['Me'];
        activeProfile = 'Me';

        const legacy = localStorage.getItem(LEGACY_KEY);
        if (legacy !== null) {
            localStorage.setItem(shelfKey('Me'), legacy);
            localStorage.removeItem(LEGACY_KEY);
        }
        saveProfiles();
    }

    function saveProfiles() {
        localStorage.setItem(PROFILES_KEY, JSON.stringify({ profiles, active: activeProfile }));
    }

    function renderProfiles() {
        const select = document.getElementById('profileSelect');
        select.innerHTML = '';
        profiles.forEach(name => select.appendChild(new Option(name, name, false, name === activeProfile)));
    }

    function refreshAll() {
        saveProfiles();
        renderProfiles();
        render();
    }

    function switchProfile(name) {
        if (!profiles.includes(name)) return;
        activeProfile = name;
        refreshAll();
    }

    function askForName(message, preset) {
        const name = (prompt(message, preset) || '').trim();
        if (!name) return null;
        // Compare against the OTHER profiles, so a profile can be recapitalised
        if (profiles.some(p => p !== preset && p.toLowerCase() === name.toLowerCase())) {
            alert(`There is already a profile named "${name}".`);
            return null;
        }
        return name;
    }

    function createProfile() {
        const name = askForName('Name for the new profile:', '');
        if (!name) return;

        profiles.push(name);
        activeProfile = name;
        localStorage.setItem(shelfKey(name), '[]'); // a new profile starts with empty shelves
        refreshAll();
    }

    function renameProfile() {
        const name = askForName('New name for this profile:', activeProfile);
        if (!name || name === activeProfile) return;

        const shelf = localStorage.getItem(shelfKey(activeProfile));
        if (shelf !== null) localStorage.setItem(shelfKey(name), shelf);
        localStorage.removeItem(shelfKey(activeProfile));

        profiles[profiles.indexOf(activeProfile)] = name;
        activeProfile = name;
        refreshAll();
    }

    function deleteProfile() {
        if (profiles.length === 1) {
            alert('This is the only profile, so it cannot be deleted.');
            return;
        }
        if (!confirm(`Delete the profile "${activeProfile}" and everything on its shelves?`)) return;

        localStorage.removeItem(shelfKey(activeProfile));
        profiles = profiles.filter(p => p !== activeProfile);
        activeProfile = profiles[0];
        refreshAll();
    }

    let draggedGameId = null;
    let justFavvedId = null; // the pop animation only plays for the game just favorited

    // Default badge of a category (favorite lives on the star, not on the badge)
    function defaultBadgeFor(cat) {
        switch (cat) {
            case 'playing':   return { badge: 'PLAYING',   bClass: 'badge-playing' };
            case 'completed': return { badge: 'COMPLETED', bClass: 'badge-done' };
            case 'dropped':   return { badge: 'DROPPED',   bClass: 'badge-drop' };
            default:          return { badge: 'BACKLOG',   bClass: 'badge-plan' };
        }
    }

    // Titles and notes are user input, so they must not be parsed as markup
    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    // Shared by mouse drop and touch drop
    function moveGame(id, cat) {
        const games = getGames();
        const game = games.find(g => g.id === id);
        if (!game || game.cat === cat) return;

        game.cat = cat;

        // Let the new category set the badge
        Object.assign(game, defaultBadgeFor(cat));

        // Favorites are completed-only → moving elsewhere clears the star
        if (cat !== 'completed') game.fav = false;

        // Move the game to the end of the array → it lands at the BOTTOM of the list
        const idx = games.indexOf(game);
        if (idx > -1) {
            games.splice(idx, 1);
            games.push(game);
        }

        saveGames(games);
    }

    function listUnderPoint(x, y) {
        const el = document.elementFromPoint(x, y);
        return el ? el.closest('.game-list') : null;
    }

    function highlightList(list) {
        document.querySelectorAll('.game-list').forEach(l => l.classList.toggle('drag-over', l === list));
    }

    function nextId(games) {
        return games.reduce((max, g) => Math.max(max, Number(g.id) || 0), 0) + 1;
    }

    function readStored() {
        const stored = localStorage.getItem(shelfKey(activeProfile));
        if (!stored) return null;
        try {
            const parsed = JSON.parse(stored);
            return Array.isArray(parsed) ? parsed : null;
        } catch (err) {
            // Unreadable data would otherwise break every render; start over instead
            console.warn('Stored shelf was unreadable, falling back to the default list.', err);
            return null;
        }
    }

    function getGames() {
        const stored = readStored();
        const games = stored || defaultGames;

        // Only completed games can be favorites — repair anything that says otherwise
        let repaired = false;
        games.forEach(g => {
            if (g.fav === undefined) {
                g.fav = g.cat === 'completed' && /FAVOR/i.test(g.badge || '');
                if (/FAVOR/i.test(g.badge || '')) Object.assign(g, defaultBadgeFor(g.cat));
                repaired = true;
            } else if (g.fav && g.cat !== 'completed') {
                g.fav = false;
                repaired = true;
            }
        });

        if (!stored || repaired) localStorage.setItem(shelfKey(activeProfile), JSON.stringify(games));
        return games;
    }

    function saveGames(games) {
        localStorage.setItem(shelfKey(activeProfile), JSON.stringify(games));
        render();
    }

    function toggleFav(id) {
        const games = getGames();
        const game = games.find(g => g.id === id);
        if (!game || game.cat !== 'completed') return; // favorites are completed-only

        game.fav = !game.fav;
        justFavvedId = game.fav ? id : null;
        saveGames(games);
    }

    function addGame() {
        const title = document.getElementById('gameTitle').value.trim();
        const desc = document.getElementById('gameDesc').value.trim();
        const cat = document.getElementById('gameCategory').value;
        const selected = document.getElementById('gameBadge').value;

        if (!title) {
            alert('Please enter a game title.');
            return;
        }

        // "Favorite ★" sets the star and lets the category pick the badge; completed-only
        const wantsFav = /FAVOR/i.test(selected);
        const fav = wantsFav && cat === 'completed';
        let badge = selected;
        let bClass = 'badge-done';

        if (wantsFav) {
            ({ badge, bClass } = defaultBadgeFor(cat));
        } else if (selected.includes('PLAYING')) bClass = 'badge-playing';
        else if (selected.includes('DROPPED') || selected.includes('UNFINISHED')) bClass = 'badge-drop';
        else if (selected.includes('BACKLOG')) bClass = 'badge-plan';

        const games = getGames();
        games.push({
            id: nextId(games),
            title,
            desc,
            cat,
            badge,
            bClass,
            fav
        });

        saveGames(games);

        document.getElementById('gameTitle').value = '';
        document.getElementById('gameDesc').value = '';
    }

    function deleteGame(id) {
        let games = getGames();
        games = games.filter(g => g.id !== id);
        saveGames(games);
    }

    function render() {
        const games = getGames();

        ['playing', 'completed', 'dropped', 'planned'].forEach(cat => {
            const container = document.getElementById(`list-${cat}`);
            container.innerHTML = '';

            // Favorites float to the TOP (sort is stable, so the rest keeps its order)
            const filtered = games
                .filter(g => g.cat === cat)
                .sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0));

            const counter = document.getElementById(`count-${cat}`);
            if (counter) counter.textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-hint">Drag a game here.</div>';
            } else {
                filtered.forEach(g => {
                    const card = document.createElement('div');
                    card.className = `game-card ${g.cat}`;
                    card.setAttribute('draggable', 'true');
                    card.setAttribute('data-id', g.id);

                    card.innerHTML = `
                        <div>
                            <div class="game-title">${escapeHtml(g.title)}</div>
                            ${g.desc ? `<div class="game-desc">${escapeHtml(g.desc)}</div>` : ''}
                        </div>
                        <div class="right-side">
                            <span class="badge ${g.bClass}">${escapeHtml(g.badge)}</span>
                            ${g.cat === 'completed' ? `<button class="fav-btn ${g.fav ? 'active' : ''} ${g.fav && g.id === justFavvedId ? 'just-favved' : ''}" onclick="toggleFav(${g.id})" title="${g.fav ? 'Remove from favorites' : 'Add to favorites'}">${g.fav ? '★' : '☆'}</button>` : ''}
                            <button class="delete-btn" onclick="deleteGame(${g.id})" title="Delete">✕</button>
                        </div>
                    `;

                    // Drag Events
                    card.addEventListener('dragstart', (e) => {
                        draggedGameId = g.id;
                        card.classList.add('dragging');
                        e.dataTransfer.setData('text/plain', g.id);
                    });

                    card.addEventListener('dragend', () => {
                        card.classList.remove('dragging');
                        draggedGameId = null;
                    });

                    // Touch devices never fire the HTML5 drag events, so mirror them:
                    // press and hold to pick a card up, then drag it onto another shelf.
                    let holdTimer = null;
                    let touchDragging = false;

                    card.addEventListener('touchstart', (e) => {
                        if (e.target.closest('button')) return; // tapping ★ / ✕ is not a drag
                        holdTimer = setTimeout(() => {
                            touchDragging = true;
                            draggedGameId = g.id;
                            card.classList.add('dragging');
                        }, 250);
                    }, { passive: true });

                    card.addEventListener('touchmove', (e) => {
                        if (!touchDragging) {
                            clearTimeout(holdTimer); // the finger is scrolling, not dragging
                            return;
                        }
                        e.preventDefault(); // keep the page still while a card is held
                        const touch = e.touches[0];
                        highlightList(listUnderPoint(touch.clientX, touch.clientY));
                    }, { passive: false });

                    const endTouchDrag = (e) => {
                        clearTimeout(holdTimer);
                        if (!touchDragging) return;

                        touchDragging = false;
                        card.classList.remove('dragging');
                        highlightList(null);

                        const touch = e.changedTouches[0];
                        const list = touch && listUnderPoint(touch.clientX, touch.clientY);
                        if (list && draggedGameId) moveGame(draggedGameId, list.dataset.cat);
                        draggedGameId = null;
                    };

                    card.addEventListener('touchend', endTouchDrag);
                    card.addEventListener('touchcancel', endTouchDrag);

                    container.appendChild(card);
                });
            }

            // Drop zone event listeners
            container.ondragover = (e) => {
                e.preventDefault();
                container.classList.add('drag-over');
            };

            container.ondragleave = (e) => {
                // Moving onto a child card also fires dragleave — keep the highlight then
                if (!container.contains(e.relatedTarget)) container.classList.remove('drag-over');
            };

            container.ondrop = (e) => {
                e.preventDefault();
                container.classList.remove('drag-over');
                if (draggedGameId) moveGame(draggedGameId, cat);
            };
        });

        justFavvedId = null; // the animation plays once
    }

    loadProfiles();
    renderProfiles();
    render();
</script>

</body>
</html>
